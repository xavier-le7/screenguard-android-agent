name: Android 0.10.18 signed TEST candidate

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-signed-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'xavier-le7/screenguard-android-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned reviewed feature code
        uses: actions/checkout@v4
        with:
          ref: af3a02f5907c6666c7123787a9e061ca52b81e5a
          persist-credentials: false
      - name: Source privacy
        run: python3 scripts/check-public-snapshot.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 35
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug build (no secret access)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Restore stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SG_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SG_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          umask 077
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          data=base64.b64decode(''.join(os.environ['KEYSTORE_B64'].split()),validate=True)
          if len(data)<100: raise SystemExit("Invalid keystore")
          Path(os.environ['RUNNER_TEMP'],'stable.p12').write_bytes(data)
          PY
          keytool -list -keystore "$RUNNER_TEMP/stable.p12" -storetype PKCS12 \
            -storepass:env STORE_PASSWORD -alias screenguard-agent >/dev/null
      - name: Build official-key-signed APK
        env:
          SG_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/stable.p12
          SG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SG_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify APK identity, version and certificate
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release.apk
          "$SIGNER" verify --print-certs "$DEBUG" > "$RUNNER_TEMP/debug.txt"
          "$SIGNER" verify --print-certs "$RELEASE" > "$RUNNER_TEMP/release.txt"
          diff <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/debug.txt") \
               <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/release.txt")
          BADGING="$("$AAPT" dump badging "$RELEASE")"
          grep -F "name='fr.sevenskies.screenguard.agent'" <<< "$BADGING" >/dev/null
          grep -F "versionCode='19'" <<< "$BADGING" >/dev/null
          grep -F "versionName='0.10.18'" <<< "$BADGING" >/dev/null
          if grep -q '^application-debuggable' <<< "$BADGING"; then exit 1; fi
          mkdir -p dist
          cp "$RELEASE" dist/screenguard-android-agent-v0.10.18-TEST.apk
          (cd dist && sha256sum screenguard-android-agent-v0.10.18-TEST.apk > screenguard-android-agent-v0.10.18-TEST.apk.sha256)
          echo "Verified Android TEST candidate. Nothing was published to Releases or GHCR."
      - name: Archive signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: screenguard-android-agent-v0.10.18-TEST-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14
